name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: PyInstaller Build
        run: pyinstaller knix_arranger.spec

      - name: ZIP erstellen
        run: Compress-Archive -Path dist\KNiX_Arranger\* -DestinationPath dist\KNiX_Arranger_${{ github.ref_name }}.zip

      - name: ZIP zum Release hochladen
        uses: softprops/action-gh-release@v2
        with:
          files: dist\KNiX_Arranger_${{ github.ref_name }}.zip
