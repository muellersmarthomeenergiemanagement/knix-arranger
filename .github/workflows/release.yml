name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract version from tag
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          echo "VERSION=$version" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Generate release notes from release_notes.json
        # Bricht ab, wenn für die getaggte Version kein Eintrag existiert –
        # vor dem Build, damit kein Release ohne Änderungsliste entsteht.
        run: |
          python -m knix_arranger.services.release_notes_service $env:VERSION --output release_notes.md
          if ($LASTEXITCODE -ne 0) { exit 1 }
        shell: pwsh

      - name: Set version in source files
        run: |
          $content = Get-Content "knix_arranger/__init__.py" -Raw
          $content = $content -replace '__version__\s*=\s*"[^"]+"', "__version__ = `"$env:VERSION`""
          Set-Content "knix_arranger/__init__.py" $content -Encoding utf8

          $iss = Get-Content "setup.iss" -Raw
          $iss = $iss -replace '(#define AppVersion\s+")([^"]+)(")', "`${1}$env:VERSION`${3}"
          Set-Content "setup.iss" $iss -Encoding utf8
        shell: pwsh

      # Nuitka kompiliert jedes Mal alle Module nach C -- der Cache der
      # C-Compiler-Ergebnisse spart bei weiteren Releases viel Zeit.
      - name: Cache Nuitka
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-py312-${{ hashFiles('requirements.txt') }}
          restore-keys: nuitka-${{ runner.os }}-py312-

      - name: Build with Nuitka
        run: python build.py

      # Kompiliertes Bundle ohne Fenster pruefen (PDF, Daten, Schrift, ...),
      # bevor ein Installer entsteht
      - name: Self-test bundle
        run: |
          $p = Start-Process "dist\KNiX_Arranger\KNiX_Arranger.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:APPDATA\KNiX Arranger\logs\knix_arranger.log" -Tail 20
          if ($p.ExitCode -ne 0) { exit 1 }
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss'
        shell: pwsh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release create "v$env:VERSION" `
            "installer/KNiX_Arranger_Setup_v$env:VERSION.exe" `
            --repo muellersmarthomeenergiemanagement/knix-arranger-releases `
            --title "KNiX Arranger $env:VERSION" `
            --notes-file release_notes.md `
            --latest
        shell: pwsh
